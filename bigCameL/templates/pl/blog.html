{% extends 'pl/layout.html' %}
{% load static %}

{% block title %}
    Blog
{% endblock %}
    
{% block body %}
{% if blog %}
    {% for b in blog %}
    <p>
        {{ b }}
    </p>
    {% endfor %}
    <div class="btns">
    <a class="prev" href="{% url 'full_blog' team_id|add:-1 %}"><span>&laquo</span> Previous</a>
    <a class="next" href="{% url 'full_blog' team_id|add:1 %}">Next<span>&raquo</span></a>
    </div>
{% endif %}

{% endblock %}
