{% extends 'pl/layout.html' %}

{% block title %}
    Create Account
{% endblock %}


{% block style %}
<style>
input {
  display: block;
  width: 100%;
  height: 38px;
  padding: 0 12px;
  font-size: 14px;
  background: #fff;
  border: 0.5px solid #2e2e2e;
  border-radius: 8px;
  color: black;
  outline: none;
  transition: border-color 0.15s, box-shadow 0.15s;
}

input::placeholder {
  color: #555;
}
</style>
{% endblock %}

{% block body %}
<h2>Create User Account</h2>
    {% if messages %}
        {% for m in messages %}
            <p>{{ m }}</p>
        {% endfor %}
    {% endif %}
    <form method="POST">
        {% csrf_token %}
        <label>Username: </label>
        <input type="text" name="username" placeholder="Username">
        <label>Email: </label>
        <input type="email" name="email" placeholder="john@example.com">
        <label>PassWord: </label>
        <input type="password" name="password" placeholder="********">
        <input type="submit">
    </form>
{% endblock %}
