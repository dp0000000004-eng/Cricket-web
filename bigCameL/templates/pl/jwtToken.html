<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="theme-color" content="#1a73e8">
        <title>Get your tokens</title>
        <style>
            :root {
                font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
                color: #172b4d;
                background: #f4f8ff;
                font-synthesis: none;
                text-rendering: optimizeLegibility;
                -webkit-font-smoothing: antialiased;
            }

            * { box-sizing: border-box; }

            body {
                min-height: 100vh;
                margin: 0;
                padding: 40px 20px;
                display: grid;
                place-items: center;
                background:
                    radial-gradient(ellipse at 15% 10%, rgba(26, 115, 232, .18), transparent 38%),
                    radial-gradient(ellipse at 90% 90%, rgba(26, 115, 232, .12), transparent 34%),
                    #f4f8ff;
            }

            .page { width: min(100%, 520px); }

            .card {
                padding: clamp(26px, 6vw, 42px);
                border: 1px solid rgba(255, 255, 255, .9);
                border-radius: 24px;
                background: rgba(255, 255, 255, 0.8);
                box-shadow: 0 24px 70px rgba(35, 83, 145, .13), 0 2px 8px rgba(35, 83, 145, .05);
                backdrop-filter: blur(18px);
                -webkit-backdrop-filter: blur(18px);
            }

            .eyebrow {
                margin: 0 0 10px;
                color: #1a73e8;
                font-size: .75rem;
                font-weight: 750;
                letter-spacing: .13em;
                text-transform: uppercase;
            }

            h1 {
                margin: 0;
                color: #14243b;
                font-size: clamp(1.8rem, 6vw, 2.25rem);
                letter-spacing: -.045em;
                line-height: 1.15;
            }

            .intro {
                margin: 12px 0 28px;
                color: #64748b;
                font-size: .96rem;
                line-height: 1.6;
            }

            .error-message {
                display: flex;
                align-items: flex-start;
                gap: 10px;
                margin: 22px 0 0;
                padding: 13px 15px;
                border: 1px solid #f2d4d4;
                border-radius: 12px;
                background: #fff7f7;
                color: #a53f45;
                font-size: .9rem;
                line-height: 1.5;
            }

            .error-message::before {
                content: "!";
                display: grid;
                flex: 0 0 19px;
                width: 19px;
                height: 19px;
                place-items: center;
                border-radius: 50%;
                background: #f9e4e4;
                color: #a53f45;
                font-size: .75rem;
                font-weight: 800;
            }

            form { display: grid; gap: 9px; }

            label {
                margin-top: 9px;
                color: #34445b;
                font-size: .88rem;
                font-weight: 650;
            }

            input[type="text"], input[type="password"] {
                width: 100%;
                min-height: 48px;
                padding: 0 14px;
                border: 1px solid #d7e1ef;
                border-radius: 12px;
                outline: none;
                background: rgba(255, 255, 255, .88);
                color: #172b4d;
                font: inherit;
                transition: border-color .18s ease, box-shadow .18s ease;
            }

            input::placeholder { color: #9aa8ba; }

            input[type="text"]:focus, input[type="password"]:focus {
                border-color: #1a73e8;
                box-shadow: 0 0 0 4px rgba(26, 115, 232, .13);
            }

            button[type="submit"] {
                width: 100%;
                min-height: 50px;
                margin-top: 14px;
                border: 0;
                border-radius: 12px;
                background: linear-gradient(135deg, #3186f5, #155fc4);
                box-shadow: 0 8px 18px rgba(26, 115, 232, .24), inset 0 1px 0 rgba(255, 255, 255, .2);
                color: #fff;
                cursor: pointer;
                font: inherit;
                font-weight: 700;
                letter-spacing: .01em;
                transition: background .18s ease, transform .18s ease, box-shadow .18s ease, opacity .18s ease;
            }

            button[type="submit"]:hover:not(:disabled) {
                transform: translateY(-1px);
                background: linear-gradient(135deg, #2678e5, #104fa9);
                box-shadow: 0 11px 22px rgba(26, 115, 232, .3), inset 0 1px 0 rgba(255, 255, 255, .2);
            }

            button[type="submit"]:active:not(:disabled) {
                transform: translateY(0);
                box-shadow: 0 4px 10px rgba(26, 115, 232, .2);
            }

            button[type="submit"]:focus-visible {
                outline: 3px solid rgba(26, 115, 232, .35);
                outline-offset: 3px;
            }

            button[type="submit"]:disabled {
                cursor: wait;
                opacity: .7;
            }

            .tokens {
                display: grid;
                gap: 14px;
                margin-top: 28px;
                padding-top: 24px;
                border-top: 1px solid #e2eaf5;
            }

            .token {
                min-width: 0;
                padding: 15px;
                border: 1px solid #e0eaf7;
                border-radius: 13px;
                background: rgba(255, 255, 255, .72);
            }

            .token-header {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 12px;
                margin-bottom: 8px;
            }

            .token h2 {
                margin: 0;
                color: #1a73e8;
                font-size: .78rem;
                font-weight: 750;
                letter-spacing: .08em;
                text-transform: uppercase;
            }

            .copy-btn {
                border: 1px solid #d7e1ef;
                border-radius: 999px;
                background: #eef5ff;
                color: #1a73e8;
                cursor: pointer;
                font: inherit;
                font-size: .73rem;
                font-weight: 700;
                padding: 7px 10px;
                transition: background .18s ease, border-color .18s ease, transform .18s ease;
            }

            .copy-btn:hover {
                background: #e2eeff;
                border-color: #bfd5ff;
                transform: translateY(-1px);
            }

            .copy-btn:focus-visible {
                outline: 3px solid rgba(26, 115, 232, .25);
                outline-offset: 2px;
            }

            .token code {
                display: block;
                overflow-wrap: anywhere;
                word-break: break-word;
                color: #3c4d63;
                font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
                font-size: .82rem;
                line-height: 1.6;
            }

            @media (max-width: 480px) {
                body {
                    padding: 24px 14px;
                    place-items: start center;
                }

                .card {
                    padding: clamp(20px, 6vw, 30px);
                    border-radius: 18px;
                }

                .intro { margin-bottom: 22px; }
                .token { padding: 13px; }
            }

            @media (min-width: 768px) {
                body { padding: 56px 32px; }
                .card { padding: 44px; }
            }

            @media (prefers-reduced-motion: reduce) {
                *, *::before, *::after { transition-duration: .01ms !important; }
            }
        </style>
    </head>
    <body>
        <main class="page">
            <section id="card" class="card" aria-labelledby="page-title">
                <p class="eyebrow">Matchday account</p>
                <h1 id="page-title">Get your tokens</h1>
                <p class="intro">Sign in with your account details to generate your authentication tokens.</p>

                <form method="POST">
                    {% csrf_token %}
                    <label for="username">Username</label>
                    <input id="username" type="text" name="username" placeholder="Enter your username" autocomplete="username" required>
                    <label for="password">Password</label>
                    <input id="password" type="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>
                    <button id="submitBtn" type="submit">Generate tokens</button>
                </form>

                    <section id="tokens" class="tokens" aria-label="Generated tokens">
                        

                    </section>
            </section>
        </main>
        <script>

            const form = document.querySelector('form');
            const submitBtn = document.getElementById('submitBtn');
            const cardEl = document.getElementById('tokens')

            form.addEventListener('submit', async (event) => {
                event.preventDefault();
                const errorMessage = document.querySelector('.error-message');
                if (errorMessage) errorMessage.remove();

                submitBtn.disabled = true;
                submitBtn.textContent = 'Generating...';

                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 5000);
                    let response;
                    try {
                        response = await fetch('http://127.0.0.1:8000/token/', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Accept': 'application/json'
                        },
                        body: JSON.stringify({
                            username: form.elements.username.value,
                            password: form.elements.password.value
                        }),
                        signal: controller.signal
                        });
                    } finally {
                        clearTimeout(timeoutId);
                    }
                    const data = await response.json();
                    if (!response.ok) {
                        throw new Error(data.error || data.detail || `Request failed (${response.status}).`);
                    }

                    let tokenSection = document.querySelector('.tokens');
                    if (!tokenSection) {
                        tokenSection = document.createElement('section');
                        tokenSection.className = 'tokens';
                        tokenSection.setAttribute('aria-label', 'Generated tokens');
                        form.after(tokenSection);
                    }
                    tokenSection.replaceChildren();
                    for (const [label, value] of [['Refresh token', data.refresh], ['Access token', data.access]]) {
                        const token = document.createElement('div');
                        token.className = 'token';
                        const heading = document.createElement('h2');
                        heading.textContent = label;
                        const code = document.createElement('code');
                        code.textContent = value ?? '';
                        token.append(heading, code);
                        tokenSection.append(token);
                    }

                    const intro = document.createElement('p');
                    intro.className = 'intro';
                    intro.append('Use access token for authentication porpose', document.createElement('br'),
                        'The Refresh token is used for generate another Access token');
                    tokenSection.append(intro);


                } catch (error) {
                    const message = document.createElement('p');
                    message.className = 'error-message';
                    message.setAttribute('role', 'alert');
                    message.textContent = error.name === 'AbortError'
                        ? 'The request timed out.'
                        : error.message || 'Unable to generate tokens.';
                    form.after(message);
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Generate tokens';
                }
            });

            function addCopyButton(token) {
                const heading = token.querySelector('h2');
                const code = token.querySelector('code');
                if (!heading || !code) return;

                const header = document.createElement('div');
                header.className = 'token-header';
                const button = document.createElement('button');
                button.className = 'copy-btn';
                button.type = 'button';
                button.textContent = 'Copy';
                button.setAttribute('aria-label', `Copy ${heading.textContent.trim().toLowerCase()}`);
                token.insertBefore(header, heading);
                header.append(heading, button);
                button.addEventListener('click', async () => {
                    const text = code.textContent.trim();
                    try {
                        if (navigator.clipboard && window.isSecureContext) {
                            await navigator.clipboard.writeText(text);
                        } else {
                            const temporary = document.createElement('textarea');
                            temporary.value = text;
                            temporary.style.position = 'fixed';
                            temporary.style.opacity = '0';
                            document.body.appendChild(temporary);
                            temporary.select();
                            const copied = document.execCommand('copy');
                            temporary.remove();
                            if (!copied) throw new Error('Copy failed');
                        }
                        button.textContent = 'Copied!';
                    } catch {
                        button.textContent = 'Copy failed';
                    }
                    setTimeout(() => { button.textContent = 'Copy'; }, 1500);
                });
            }







            document.querySelectorAll('.token').forEach(addCopyButton);
        </script>
    </body>
</html>
